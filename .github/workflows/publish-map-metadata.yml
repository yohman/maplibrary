name: Publish map metadata edits

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.user.login == 'yohman'
    runs-on: ubuntu-latest
    outputs:
      map_id: ${{ steps.apply.outputs.map_id }}
      fields: ${{ steps.apply.outputs.fields }}
      map_title: ${{ steps.apply.outputs.map_title }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out the Map Library
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate the request and update the source records
        id: apply
        run: node scripts/apply-map-edit.mjs

      - name: Regenerate the published JSON from the edited CSV
        run: node scripts/build-maps-json.mjs

      - name: Commit and publish to main
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/maps.csv data/maps.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update map metadata: ${{ steps.apply.outputs.map_id }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  report:
    if: always() && github.event.issue.user.login == 'yohman'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Report the result on the issue
        uses: actions/github-script@v7
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_CHANGED: ${{ needs.publish.outputs.changed }}
          MAP_ID: ${{ needs.publish.outputs.map_id }}
          MAP_TITLE: ${{ needs.publish.outputs.map_title }}
          FIELD_COUNT: ${{ needs.publish.outputs.fields }}
        with:
          script: |
            const result = process.env.PUBLISH_RESULT;
            const issue_number = context.issue.number;
            if (result === 'success') {
              const changed = process.env.PUBLISH_CHANGED === 'true';
              const message = changed
                ? `Published **${process.env.MAP_TITLE}** (Map Library record #${process.env.MAP_ID}): ${process.env.FIELD_COUNT} field(s) updated in the CSV and JSON records. The live HyperCities site reads the CSV directly; GitHub Pages should reflect it within a few minutes.`
                : 'No file changes were needed; the requested values already match the Map Library.';
              await github.rest.issues.createComment({ ...context.repo, issue_number, body: message });
              await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed' });
            } else {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `This edit was not published. Please check the [workflow details](${runUrl}) and correct the request. The source CSV was left unchanged if validation failed.`
              });
            }
